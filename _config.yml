title: RoveSoSimulator
description: Autonomous Rover Testing Simulator in Unreal Engine 5
remote_theme: "godalming123/minimal"
plugins:
  - jekyll-remote-theme
color-scheme: "auto-default-dark"
logo: "https://i.postimg.cc/XYtdp84Z/logo.png"
navigation:
  - link: "/"
    name: "Home"
  - link: "/setup/"
    name: "Getting Started"
  - link: "/documentation/"
    name: "Documentation"
  - link: "/simulator-use/"
    name: "Using RoveSoSimulator"
  - link: "/unreal/"
    name: "Unreal"
defaults:
  - scope:
      path: "pages"
    values:
      permalink: /:basename/
  - scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "default"
