title: RoveSoSimulator
description: Autonomous Rover Testing Simulator in Unreal Engine 5

url: "https://docs.themrdt.org"
baseurl: ""
baseSubDir: "/RoveSoSimulator"

remote_theme: "godalming123/minimal"
plugins:
  - jekyll-remote-theme

# IMPORTANT: tells jekyll-github-metadata what repo this is (so you don’t need env hacks)
repository: "MissouriMRDT/RoveSoSimulator"  # :contentReference[oaicite:0]{index=0}

navigation:
  - link: "/"
    name: "Home"
  - link: "/setup/"
    name: "Getting Started"
  - link: "/documentation/"
    name: "Documentation"
  - link: "/simulator-use/"
    name: "Using RoveSoSimulator"
  - link: "/unreal/"
    name: "Unreal"

defaults:
  - scope:
      path: "docs"
    values:
      layout: "default"
      # This is the big one: trailing slash avoids redirect loops
      permalink: /:basename/
