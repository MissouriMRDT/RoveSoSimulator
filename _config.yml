title: RoveSoSimulator
description: Autonomous Rover Testing Simulator in Unreal Engine 5

url: "https://docs.themrdt.org"
baseurl: "/RoveSoSimulator"

remote_theme: "godalming123/minimal"
plugins:
  - jekyll-remote-theme

repository: "MissouriMRDT/RoveSoSimulator"

navigation:
  - link: "/"
    name: "Home"
  - link: "/setup/"
    name: "Getting Started"
  - link: "/documentation/"
    name: "Documentation"
  - link: "/simulator-use/"
    name: "Using RoveSoSimulator"
  - link: "/unreal/"
    name: "Unreal"
  - link: "/systems/"
    name: "Systems"

collections:
  docs:
    output: true
    permalink: /:path/

defaults:
  - scope: 
      path: "_docs"
    values:
      layout: "default"

  - scope:
      path: "_docs/pages"
    values:
      permalink: /:name/
