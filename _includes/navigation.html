<ul>
	{% for item in site.navigation %}
		<li>
			{{ page.url }}
			{% if page.url == item.link or page.url == {{item.link | append: ".html" }} %}
				<strong>{{ item.name }}</strong>
			{% else %}
				<a href="/RoveSoSimulator{{ item.link }}">{{ item.name }}</a>
			{% endif %}
		</li>
  {% endfor %}
</ul>
